<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>סולם — שאלון ערכים לבחירות 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131A2A; --ink-2:#2A3348; --ink-soft:#4A5166; --muted:#6E6858;
  --paper:#FBFAF7; --slip:#FFFDF6; --ground:#EFEDE6; --tray:#DFDBD0; --tray-edge:#C6C1B4;
  --rule:#DBD6C9; --rule-2:#F4F1E8; --line:#A81E14; --assent:#2F5D50; --gold:#9B7A1A;
  --serif:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --sans:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--line)}
code{font-size:.9em;background:var(--ground);padding:1px 5px;border-radius:4px}

.app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative}
.app.form{background:var(--ground)}
@media (min-width:600px){
  body{background:#D9D5CB;padding:28px 0}
  .app{min-height:calc(100dvh - 56px);box-shadow:0 30px 60px -30px rgba(19,26,42,.45),0 0 0 1px rgba(19,26,42,.09)}
}
main{flex:1;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-weight:800;line-height:1.13;margin:0;letter-spacing:-.015em}
h1{font-size:1.95rem}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 1em}
.pad{padding-inline:22px}
.muted{color:var(--muted)}
.small{font-size:.78rem;line-height:1.55;color:var(--muted)}
.lead{font-size:.86rem;line-height:1.62;color:var(--ink-soft)}
.label{font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.grow{flex:1}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column}
.mono{font-family:var(--serif);font-weight:700}

/* letterhead + spine */
.letterhead{background:var(--slip);border-bottom:2px solid var(--ink);box-shadow:0 2px 0 rgba(19,26,42,.07);padding:calc(16px + env(safe-area-inset-top)) 22px 13px;position:sticky;top:0;z-index:3}
.spine{display:flex;gap:4px;margin-top:10px}
.spine span{flex:1;height:4px;background:var(--rule);position:relative;overflow:hidden}
.spine span.done{background:var(--ink)}
.spine span.cur{flex:3}
.spine span i{position:absolute;inset:0 auto 0 0;right:0;width:0;background:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:4px 9px;min-height:32px}
.tally{display:inline-flex;align-items:flex-end;gap:2px}
.tally i{width:3px;height:11px;background:var(--line);display:block}
.tally b{font-size:.6rem;color:var(--line);line-height:1;font-weight:400}

/* ladder */
.ladder{position:relative;margin:16px 22px 0;padding-right:21px;display:flex;flex-direction:column;gap:5px}
.ladder::before{content:"";position:absolute;right:20px;top:10px;bottom:10px;width:3px;background:#CFC9BA}
.rung{display:flex;align-items:stretch;min-height:58px;background:var(--slip);border:1.5px solid var(--rule);box-shadow:1px 2px 0 rgba(19,26,42,.07);width:100%}
.rung .lvl{width:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;background:var(--rule-2);border-left:1.5px solid var(--rule);font-family:var(--serif);font-weight:700;font-size:1.12rem}
.rung .txt{padding:11px 13px;font-size:.855rem;line-height:1.4;display:flex;align-items:center;flex:1}
.rung .tick{display:none;align-items:center;padding-left:12px}
.rung.sel{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:2px 3px 0 rgba(19,26,42,.2)}
.rung.sel .lvl{background:var(--ink-2);border-color:transparent}
.rung.sel .tick{display:flex}

/* stamp */
.stampbox{margin:16px 22px 0}
.stampbtn{width:100%;min-height:62px;border:1.5px solid var(--rule);background:var(--slip);box-shadow:1px 2px 0 rgba(19,26,42,.07);display:flex;align-items:center;justify-content:center;padding:8px 14px}
.stamp{transform:rotate(-2.2deg);border:2.5px solid var(--rule);outline:1px solid var(--rule);outline-offset:3px;padding:6px 18px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.stamp .mark{display:none}
.stamp span{font-family:var(--serif);font-weight:700;font-size:1rem;letter-spacing:.14em}
.stampbtn.on .stamp{border-color:var(--line);outline-color:var(--line);color:var(--line)}
.stampbtn.on .stamp .mark{display:block}
.stampbtn[disabled]{opacity:.45;cursor:default}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 18px;font-size:1rem;font-weight:500;border:1.5px solid var(--ink);width:100%}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule);color:var(--ink-soft);font-weight:400;min-height:46px;font-size:.85rem}
.btn.bare{border-color:transparent;color:var(--muted);font-weight:400;min-height:44px;font-size:.85rem}
.btn[disabled]{opacity:.35;cursor:default}
.navbar{background:var(--slip);border-top:2px solid var(--ink);padding:12px 22px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;position:sticky;bottom:0;z-index:2}
.navbar .btn{width:auto}
.iconbtn{width:50px;flex:0 0 50px;height:50px;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 22px 14px;border-bottom:1px solid var(--rule)}

/* ballot slip */
.slip{background:var(--slip);border:1.5px solid var(--ink);box-shadow:1px 2px 0 rgba(19,26,42,.09);display:flex;flex-direction:column;align-items:center;padding:9px 7px 7px;height:100%;width:100%}
.slip.lead{box-shadow:3px 4px 0 rgba(19,26,42,.16)}
.slip.unconfirmed{border-style:dashed;border-color:var(--rule)}
.slip .ltrs{font-family:var(--serif);font-weight:800;line-height:1;letter-spacing:.02em}
.slip .hair{width:22px;height:1px;background:var(--rule);margin:7px 0 6px}
.slip .nm{font-size:.6rem;line-height:1.32;text-align:center;color:var(--ink-soft);text-wrap:pretty}
.slip .foot{width:100%;border-top:1px solid var(--rule);padding-top:5px;display:flex;align-items:flex-end;margin-top:auto}
.slip .foot .pct{font-family:var(--serif);font-weight:700;font-size:.9rem;line-height:1;margin-inline-start:auto}
.tray{margin:7px 22px 0;background:var(--tray);border:1.5px solid var(--tray-edge);padding:9px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cell{display:block;background:var(--tray);box-shadow:inset 0 2px 4px rgba(19,26,42,.16);padding:6px;height:138px}
.cell.lead{box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 2px 4px rgba(19,26,42,.14)}
.cell.empty{display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#8E897B}

/* envelope */
.envelope{position:relative;margin:20px 22px 0;background:var(--slip);border:1.5px solid var(--ink);box-shadow:3px 4px 0 rgba(19,26,42,.12);padding:40px 16px 16px}
.envelope .flap{position:absolute;top:0;right:0;left:0;height:40px;overflow:hidden;pointer-events:none}
.envelope .seal{position:absolute;top:12px;left:14px;width:52px;height:40px;border:1px dashed var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.line-field{height:46px;border-bottom:1.5px solid var(--rule);display:flex;align-items:flex-end;padding:0 2px 5px}
.line-field.filled{border-bottom-color:var(--ink)}
.line-field input{width:100%;border:0;background:none;font-family:var(--serif);font-size:1.05rem;padding:0;min-height:34px}
.line-field input::placeholder{color:#C3BDAC;font-family:var(--sans);font-size:.85rem}
.slot{height:20px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.slot i{width:128px;height:5px;background:#05070E;box-shadow:inset 0 1px 2px rgba(0,0,0,.8);display:block}

/* boxes / lists */
.box{border:1.5px solid var(--rule);padding:15px 16px;background:var(--paper)}
.box.paper{background:var(--slip);box-shadow:1px 2px 0 rgba(19,26,42,.07)}
.box.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.itm{display:flex;gap:10px;align-items:flex-start;font-size:.79rem;line-height:1.5}
.itm svg{flex:0 0 auto;margin-top:2px}
.rule-top{border-top:2px solid var(--ink);padding-top:14px}
.hr{height:1px;background:var(--rule)}

/* review */
.chapter{background:var(--slip);border:1.5px solid var(--rule);width:100%}
.chapter.open{border-color:var(--ink);box-shadow:2px 3px 0 rgba(19,26,42,.1)}
.chapter > .head{display:flex;align-items:center;gap:11px;padding:12px 14px;width:100%}
.chapter.open > .head{border-bottom:1px solid var(--rule)}
.chapter .n{font-family:var(--serif);font-weight:700;font-size:.88rem;color:var(--tray-edge);width:14px;flex:0 0 14px}
.chapter .cn{font-family:var(--serif);font-weight:700;font-size:.9rem}
.qgrid{padding:12px 14px 6px;display:flex;flex-wrap:wrap;gap:5px}
.qcell{width:34px;height:34px;border:1px solid var(--rule);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:.82rem}
.qcell.red{box-shadow:inset 0 -3px 0 var(--line)}
.qcell.skip{border-style:dashed;border-color:var(--tray-edge);background:var(--rule-2);color:#A69F8E;font-family:var(--sans);font-weight:400}
.qcell.cur{outline:2px solid var(--gold);outline-offset:1px}
.qrow{border-top:1px solid var(--rule);padding:12px 14px;display:flex;align-items:flex-start;gap:12px;width:100%}
.qrow .badge{width:34px;height:34px;flex:0 0 34px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:.88rem}
.qrow .badge.red{box-shadow:inset 0 -3px 0 var(--line)}
.qrow .badge.skip{background:var(--rule-2);border:1px dashed var(--tray-edge);color:#A69F8E;font-family:var(--sans);font-weight:400}
.qrow .act{font-size:.78rem;color:var(--line);flex:0 0 auto;padding-top:14px}

/* party detail */
.diffstrip{display:flex;gap:4px;margin-top:11px}
.diffstrip div{flex:1;height:34px;border:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--serif);font-weight:700;font-size:.82rem;color:var(--tray-edge)}
.diffstrip div small{font-family:var(--sans);font-size:.5rem;font-weight:400;line-height:1}
.diffstrip div.me{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.diffstrip div.them{border:1.5px solid var(--line);color:var(--line)}
.vbar{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:.72rem}
.vbar .nm{width:108px;flex:0 0 108px}
.vbar .bar{flex:1;height:6px;background:var(--ground)}
.vbar .bar i{display:block;height:100%;background:var(--ink)}
.vbar .pc{width:26px;flex:0 0 26px;text-align:left;font-family:var(--serif);font-weight:700;font-size:.76rem}
.vbar.low .nm,.vbar.low .pc{color:var(--line)}
.vbar.low .bar i{background:var(--line)}

/* analysis */
.pblock{margin-top:24px;border-top:2px solid var(--ink);padding-top:16px}
.reason{display:flex;flex-direction:column;gap:8px;padding-right:23px}
.reason p{margin:0;font-size:.82rem;line-height:1.58}
.tag{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:.7rem;letter-spacing:.05em;font-weight:500}
.tag.yes{color:var(--assent)} .tag.no{color:var(--line)}
.tradeoff{margin-top:18px;background:var(--ground);padding:14px 15px;font-family:var(--serif);font-size:.91rem;line-height:1.55}

/* fields */
.field{margin:10px 0}
.field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:.95rem;padding:11px 12px;border:1.5px solid var(--rule);background:#fff;min-height:46px}
.field textarea{min-height:62px;resize:vertical}
.err{color:var(--line);font-size:.74rem;min-height:1.2em;margin:4px 0 0}

/* admin */
.admin-bar{background:var(--ink);color:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 20px 16px;position:sticky;top:0;z-index:3}
.admin-bar select{background:#ffffff1f;color:#fff;border:1px solid #ffffff40;padding:6px 9px;font:inherit;font-size:.82rem;max-width:100%}
.admin-bar button{font-size:.75rem;opacity:.8}
.heat{display:flex;flex-direction:column;gap:4px}
.heat .hrow{display:flex;align-items:center;gap:9px}
.heat .hrow > span:first-child{width:78px;flex:0 0 78px;font-size:.62rem;color:var(--muted);text-align:left}
.heat .cells{display:flex;gap:3px;flex-wrap:wrap}
.heat i{width:12px;height:12px;display:block;background:var(--rule);cursor:pointer}
.heat i.ok{background:var(--ink)}
.heat i.est{background:var(--gold)}
.heat i.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.rung.est{border-color:var(--gold);background:#FBF6E8}
.rung.est .lvl{background:var(--gold);color:var(--paper);border-color:transparent}
.seg{display:flex;border:1.5px solid var(--rule)}
.seg button{min-height:42px;padding:0 16px;font-size:.82rem;color:var(--ink-soft)}
.seg button.on{background:var(--line);color:var(--paper)}
.seg button.on.neutral{background:var(--ink)}

.footer{padding:16px 22px calc(16px + env(safe-area-inset-bottom));font-size:.72rem;line-height:1.55;color:var(--muted);border-top:1px solid var(--rule)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){h1{font-size:1.75rem}.rung .txt{font-size:.8rem}.vbar .nm{width:92px;flex-basis:92px}}
</style>
</head>

<script>window.__DATA__={"questions": {"values": [{"id": "v1", "n": 1, "name": "מדינה יהודית", "intro": "בכל שאלה, 5 = הביטוי המקסימלי של הערך, 1 = היעדרו. המשתמש בוחר את השלב שהכי קרוב אליו. המפלגה מתויגת על ידך על אותו סולם, עם הנמקה (הצבעה / הצעת חוק / קישור).", "questions": [{"id": "v1_q1", "n": 1, "title": "מעמד ההלכה בחוק המדינה", "poles": null, "rungs": [{"level": 5, "text": "ההלכה היא מקור הסמכות של חוק המדינה; חוק הסותר הלכה אינו תקף"}, {"level": 4, "text": "מוסדות המדינה פועלים לפי ההלכה; הפרט אינו כפוף לה"}, {"level": 3, "text": "המדינה מאפשרת חיים לפי ההלכה ומגנה עליהם, אך אינה פועלת לפיה"}, {"level": 2, "text": "ההלכה היא מקור השראה תרבותי בלבד, ללא מעמד משפטי"}, {"level": 1, "text": "אין להלכה כל מעמד במדינה"}]}, {"id": "v1_q2", "n": 2, "title": "זהות לאומית בחוק", "poles": null, "rungs": [{"level": 5, "text": "המדינה יהודית בחוק יסוד, והזהות היהודית גוברת על שוויון כשהם מתנגשים"}, {"level": 4, "text": "המדינה יהודית בחוק יסוד, לצד שוויון אזרחי מלא"}, {"level": 3, "text": "יהודית בסמלים, בשפה ובלוח השנה, ללא עיגון חוקתי"}, {"level": 2, "text": "הזהות היהודית היא עובדה תרבותית־דמוגרפית, לא משפטית"}, {"level": 1, "text": "מדינת כל אזרחיה, ללא זהות לאומית בחוק"}]}, {"id": "v1_q3", "n": 3, "title": "חוק השבות", "poles": null, "rungs": [{"level": 5, "text": "עלייה ליהודים לפי הלכה בלבד (אם יהודייה או גיור אורתודוקסי)"}, {"level": 4, "text": "החוק הנוכחי, כולל סעיף הנכד, בפיקוח הדוק על ניצול לרעה"}, {"level": 3, "text": "החוק הנוכחי כפי שהוא"}, {"level": 2, "text": "הרחבה לכל מי שמזדהה עם העם היהודי וקשר בו את גורלו"}, {"level": 1, "text": "ביטול חוק השבות; הגירה לפי קריטריונים אזרחיים אחידים"}]}, {"id": "v1_q4", "n": 4, "title": "גיור", "poles": null, "rungs": [{"level": 5, "text": "רק גיור אורתודוקסי דרך הרבנות הראשית מוכר, לכל דבר ועניין"}, {"level": 4, "text": "גיור אורתודוקסי, כולל פרטי, מוכר; גיור אחר אינו מוכר"}, {"level": 3, "text": "גיור אורתודוקסי לרישום ולנישואין; גיור של זרמים אחרים לאזרחות בלבד"}, {"level": 2, "text": "כל גיור של זרם מוכר בעם היהודי שווה לכל דבר"}, {"level": 1, "text": "המדינה אינה עוסקת בגיור; זהות דתית היא עניין פרטי"}]}, {"id": "v1_q5", "n": 5, "title": "נישואין וגירושין", "poles": null, "rungs": [{"level": 5, "text": "נישואין וגירושין רק דרך הרבנות, ללא הכרה בחלופות"}, {"level": 4, "text": "רבנות בלבד, אך הכרה בנישואי חו\"ל ובידועים בציבור"}, {"level": 3, "text": "נישואין אזרחיים במקביל לרבנות, לבחירת הזוג"}, {"level": 2, "text": "נישואין אזרחיים כברירת מחדל; טקס דתי כתוספת פרטית"}, {"level": 1, "text": "המדינה אינה מכירה בנישואין דתיים כלל"}]}, {"id": "v1_q6", "n": 6, "title": "שבת במרחב הציבורי", "poles": null, "rungs": [{"level": 5, "text": "איסור מסחר ותחבורה בשבת בחוק, בכל הארץ"}, {"level": 4, "text": "גופי מדינה ותחבורה ציבורית מושבתים; הפרט והשוק חופשיים"}, {"level": 3, "text": "המדינה חייבת לאפשר שמירת שבת (זכות לא לעבוד), ללא איסורים"}, {"level": 2, "text": "שבת כיום מנוחה רשמי בלבד, ללא משמעות מעשית"}, {"level": 1, "text": "אין לשבת מעמד בחוק"}]}, {"id": "v1_q7", "n": 7, "title": "כשרות בגופי מדינה", "poles": null, "rungs": [{"level": 5, "text": "כשרות חובה בכל מוסד ציבורי, בפיקוח הרבנות בלבד"}, {"level": 4, "text": "כשרות חובה במוסדות מדינה; הפיקוח פתוח לגופים נוספים"}, {"level": 3, "text": "חובה להציע אופציה כשרה בכל מוסד ציבורי"}, {"level": 2, "text": "כשרות היא עניין של השוק הפרטי; המדינה לא מתערבת"}, {"level": 1, "text": "המדינה אינה מממנת ואינה מפקחת על כשרות כלל"}]}, {"id": "v1_q8", "n": 8, "title": "הרבנות הראשית", "poles": null, "rungs": [{"level": 5, "text": "רשות ממלכתית עם סמכות מחייבת בכל ענייני הדת"}, {"level": 4, "text": "רשות ממלכתית, סמכותה מוגבלת לתחומים מוגדרים בחוק"}, {"level": 3, "text": "גוף ייעוצי ממלכתי ללא סמכות אכיפה"}, {"level": 2, "text": "גוף פרטי של הציבור הדתי, כמו כל זרם אחר"}, {"level": 1, "text": "ביטול הרבנות הראשית כמוסד מדינה"}]}, {"id": "v1_q9", "n": 9, "title": "הזרמים והתפוצות", "poles": null, "rungs": [{"level": 5, "text": "רק האורתודוקסיה מוכרת כיהדות לצורכי המדינה"}, {"level": 4, "text": "הכרה בזרמים לצרכים אזרחיים, לא לצרכים דתיים"}, {"level": 3, "text": "הכרה שווה במרחבי תפילה ובכותל, לא בענייני אישות"}, {"level": 2, "text": "הכרה שווה בכל הזרמים לכל דבר ועניין"}, {"level": 1, "text": "המדינה אינה מכריעה מהי יהדות כלל"}]}, {"id": "v1_q10", "n": 10, "title": "חינוך", "poles": null, "rungs": [{"level": 5, "text": "לימודי יהדות חובה בכל הזרמים; אוטונומיה מלאה לחינוך דתי ללא תנאי"}, {"level": 4, "text": "אוטונומיה לחינוך דתי; לימודי יהדות חובה בממלכתי"}, {"level": 3, "text": "ליבה חובה לכולם כתנאי לתקצוב; יהדות בממלכתי כבחירה"}, {"level": 2, "text": "ליבה חובה ללא תנאי; יהדות בממלכתי כתרבות בלבד"}, {"level": 1, "text": "מערכת חינוך אחת, חילונית, לכולם"}]}, {"id": "v1_q11", "n": 11, "title": "הקצאת משאבים לפי לאום", "poles": null, "rungs": [{"level": 5, "text": "עדיפות ליהודים בקרקע, בדיור ובתקציב היא מדיניות לגיטימית ומוצהרת"}, {"level": 4, "text": "עדיפות ליישוב יהודי בפריפריה ובאזורים אסטרטגיים בלבד"}, {"level": 3, "text": "שוויון פורמלי, אך המדינה רשאית לקדם התיישבות יהודית ביוזמות ייעודיות"}, {"level": 2, "text": "שוויון מלא בהקצאה, ללא שיקול לאום"}, {"level": 1, "text": "העדפה מתקנת למיעוט הלא־יהודי"}]}, {"id": "v1_q12", "n": 12, "title": "ארץ ישראל", "poles": null, "rungs": [{"level": 5, "text": "ריבונות על כל הארץ היא חובה, ללא תנאי"}, {"level": 4, "text": "התיישבות היא פרויקט לאומי שהמדינה חייבת לקדם ולהרחיב"}, {"level": 3, "text": "הארץ נכס לאומי; המצב הקיים נשמר, אך ניתן למשא ומתן"}, {"level": 2, "text": "לשטח אין ערך עצמי; רק שיקולים ביטחוניים ומעשיים"}, {"level": 1, "text": "נסיגה משטחים היא ערך בפני עצמו"}]}, {"id": "v1_q13", "n": 13, "title": "ירושלים והר הבית", "poles": null, "rungs": [{"level": 5, "text": "ריבונות ישראלית מלאה, כולל תפילה יהודית בהר הבית"}, {"level": 4, "text": "ריבונות מלאה; הסטטוס קוו בהר הבית נשמר"}, {"level": 3, "text": "ירושלים מאוחדת; הסדרים בשכונות ערביות אפשריים"}, {"level": 2, "text": "חלוקה מוסכמת של העיר אפשרית במסגרת הסדר"}, {"level": 1, "text": "ירושלים משותפת או בינלאומית, ללא ריבונות ישראלית בלעדית"}]}, {"id": "v1_q14", "n": 14, "title": "יחס למיעוט <script>
/* ---------- config ---------- */
const CONFIG = {
  // כשהשאלון מוגש מתוך ה-Apps Script, השרת מזריק את הכתובת של עצמו ואין מה למלא כאן.

  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },

};

  back:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></svg>',
  next:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  cross:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>',

/* ---------- boot ---------- */
async function load(){
  if(window.__DATA__){ S.q=window.__DATA__.questions; S.p=window.__DATA__.parties; }
  else{
    try{
      const [q,p] = await Promise.all([fetch('questions.json').then(r=>r.json()), fetch('parties.json').then(r=>r.json())]);
      S.q=q; S.p=p;
    }catch(e){
      document.getElementById('app').innerHTML='<main class="pad" style="padding-top:40px"><h2>לא נטענו הנתונים</h2><p class="lead">הקובץ צריך לרוץ משרת (למשל <code>python3 -m http.server</code>) או להיבנות כקובץ אחד עם <code>build_bundle.py</code>.</p></main>';
      return;
    }
  }
  const savedP = store.get('parties'); if(savedP && savedP.parties) S.p = savedP;
  if(CONFIG.endpoint){
    try{ const r = await fetch(CONFIG.endpoint+'?action=tags').then(r=>r.json());
      if(r.tags) S.p.parties.forEach(p=>{ if(r.tags[p.id]) p.tags={...p.tags, ...r.tags[p.id]}; });
    }catch(e){ console.warn('tags from sheet failed', e); }
  }
  S.answers = store.get('answers') || {};
  S.user = Object.assign({first:'',last:'',email:''}, store.get('user') || {});
  S.token = store.get('token') || '';
  S.analysis = store.get('analysis') || null;
  S.submitted = !!store.get('submitted');
  applyHash();
  window.addEventListener('hashchange', ()=>{ applyHash(); render(); });
  render();
  const t = tokenFromHash();
  if(t && CONFIG.endpoint) recallByToken(t);
}
function tokenFromHash(){
  if(typeof window!=='undefined' && window.__RECALL__) return window.__RECALL__;   // הוזרק על ידי השרת מ-?r=
  const m = /(?:^|[#&?])r=([A-Za-z0-9_-]{8,})/.exec((location.hash||'')+(location.search||''));
  return m ? m[1] : '';
}
function applyHash(){
  S.admin = (location.hash === '#admin');
  if(S.admin){ S.screen='intro'; S.vi=0; S.qi=0; }
}

/* ---------- helpers ---------- */
const allQ = ()=>S.q.values.flatMap(v=>v.questions.map(q=>({...q, value:v})));

const redlineCount = ()=>Object.values(S.answers).filter(a=>a&&a.level&&a.principled).length;
const totalQ = ()=>allQ().length;
function qIndexGlobal(vi,qi){ let n=0; for(let i=0;i<vi;i++) n+=S.q.values[i].questions.length; return n+qi+1; }
function firstUnanswered(){
  for(let vi=0;vi<S.q.values.length;vi++){ const v=S.q.values[vi];
    for(let qi=0;qi<v.questions.length;qi++){ if(!S.answers[v.questions[qi].id]) return {vi,qi}; } }
  return null;
}
function locateQ(qid){
  for(let vi=0;vi<S.q.values.length;vi++){ const idx=S.q.values[vi].questions.findIndex(q=>q.id===qid); if(idx>=0) return {vi,qi:idx}; }
  return null;
}
const HEB = /^[א-ת][א-ת\s'"׳״\-־]{0,30}$/;
const MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function identityOk(u){ return HEB.test(u.first.trim()) && u.first.trim().length>=2 && HEB.test(u.last.trim()) && u.last.trim().length>=2 && MAIL.test(u.email.trim()); }
const fullName = ()=>(S.user.first+' '+S.user.last).trim();
const rl = (n)=> n===1 ? 'קו אדום אחד' : n+' קווים אדומים';
const qn = (n)=> n===1 ? 'שאלה אחת' : n+' שאלות';
function commit(){ store.set('answers', S.answers); }
function ltrSize(l){ const n=(l||'').length; return n<=1?34:(n===2?29:23); }

/* ---------- scoring ---------- */
function score(party){
  let sw=0, sd=0, n=0; const byValue={}; const redlines=[], theirs=[];
  for(const v of S.q.values){ let vw=0, vd=0, vn=0;
    for(const q of v.questions){ const a=S.answers[q.id]; const t=party.tags[q.id];
      if(!a||!a.level||!t||!t.level) continue;
      const d=Math.abs(a.level-t.level); const w=a.principled?2:1; const s=1-d/4;
      sw+=w; sd+=w*s; n++; vw+=w; vd+=w*s; vn++;
      if(a.principled && d>=2) redlines.push({q:{...q, value:v}, a, t, d});
      else if(t.principled && d>=2) theirs.push({q:{...q, value:v}, a, t, d});
    }
    byValue[v.id] = vn ? {pct:Math.round(100*vd/vw), n:vn} : null;
  }
  let gapValue=null, gmin=101;
  for(const v of S.q.values){ const b=byValue[v.id]; if(b && b.pct<gmin){ gmin=b.pct; gapValue=v; } }
  return {pct: sw ? Math.round(100*sd/sw) : null, n, byValue, redlines, theirs, gapValue};
}
function ranked(){
  return S.p.parties.map(p=>({p, s:score(p)}))
    .filter(r=>r.s.pct!==null)
    .sort((a,b)=> S.sort==='redlines'
      ? (b.s.redlines.length-a.s.redlines.length) || (b.s.pct-a.s.pct)
      : (b.s.pct-a.s.pct));
}

}

}

    const s=$(`<span class="${cls}"></span>`);
    if(i===curVi && done<v.questions.length) s.append($(`<i style="width:${Math.round(100*done/v.questions.length)}%"></i>`));
    el.append(s);
  });
  return el;
}
function tallyEl(n){
  if(!n) return '';
  const bars='<i></i>'.repeat(Math.min(n,4));
  return `<span class="tally" title="${n} קווים אדומים">${bars}${n>4?'<b>+</b>':''}</span>`;
}

/* ---------- 1 · intro ---------- */
function introView(){
  const total=totalQ(), done=answered();

      </div>
      <div class="tray" style="margin:22px 0 0;grid-template-columns:repeat(4,minmax(0,1fr))">
        ${[22,30,18].map(w=>`<span class="cell" style="height:86px"><span class="slip" style="justify-content:center;gap:8px"><i style="width:${w}px;height:5px;background:var(--rule);display:block"></i><i style="width:32px;height:1px;background:var(--rule-2);display:block"></i></span></span>`).join('')}
        <span class="cell empty" style="height:86px;font-family:var(--serif);font-size:.95rem">ועוד ${S.p.parties.length-3}</span>
      </div>
      <p class="small" style="margin:10px 2px 0">בסוף תקבל את המגש כולו — ${S.p.parties.length} הפתקים, מסודרים לפי הקרבה אליך, וכל אחד עם המחיר שלו.</p>
      <div class="stack" style="gap:9px;margin:22px 0 26px">
        <button class="btn primary" id="start">${done? 'להמשיך מאיפה שעצרתי · '+done+'/'+total : 'להתחיל'}${ICON.next}</button>
        <div class="small" style="text-align:center">כ־12 דקות · אפשר לעצור באמצע ולחזור<br>השם והמייל נמסרים בסוף, לפני שהמגש נפתח</div>
        ${S.submitted? '<button class="btn ghost" id="mine">לחזור למגש שלי</button>' : ''}
        <button class="btn ghost" id="ret">${ICON.mail}כבר מסרתי — לחזור להמלצה שלי</button>
        ${done? '<button class="btn bare" id="reset">להתחיל טופס חדש</button>' : ''}
      </div>
    </div>
  </main>`);
  el.querySelector('#start').onclick=()=>{
    const f=firstUnanswered();
    if(f){ S.vi=f.vi; S.qi=f.qi; S.screen = f.qi===0 ? 'value' : 'q'; }
    else S.screen='submit';
    render();
  };
  el.querySelector('#ret').onclick=()=>{ S.screen='ret'; S.msg=''; render(); };
  const mine=el.querySelector('#mine'); if(mine) mine.onclick=()=>{ S.screen='results'; render(); };
  const rs=el.querySelector('#reset'); if(rs) rs.onclick=()=>{
    if(!confirm('למחוק את כל התשובות ולהתחיל טופס חדש?')) return;
    S.answers={}; S.analysis=null; S.submitted=false; S.token='';
    store.set('answers',{}); store.set('analysis',null); store.set('submitted',false); store.set('token','');
    S.screen='intro'; render();
  };
  return el;
}

        <div class="row" style="gap:12px;margin-bottom:9px">
          <span style="width:30px;height:30px;flex:0 0 30px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:.88rem">5</span>

      <div class="itm" style="margin-top:16px;color:var(--muted)">${ICON.curtain}<span class="small">אתה מאחורי הפרגוד. מה שאתה מסמן נשמר במכשיר שלך בלבד, ולא יוצא לשום מקום עד שתמסור את הטופס בסוף.</span></div>
      <div class="stack" style="gap:12px;margin:26px 0">

/* ---------- 3 · question ---------- */
function questionView(){
  const v=S.q.values[S.vi], q=v.questions[S.qi];
  const a=S.answers[q.id]||{level:null, principled:false};
  const fromReview = S.returnTo==='review';
  const poles=(q.poles||'').split(/,\s*(?=1\s*=)/);
  const el=$(`<main>
    <div class="letterhead">
      <div class="row"><span class="mono" style="font-size:.88rem">${esc(v.name)}</span>
        <span class="small">ערך ${v.n} מתוך ${S.q.values.length}</span><span class="grow"></span>
        <button class="chip" id="jump">${ICON.list}<span class="mono" style="font-size:.82rem;color:var(--ink-soft)" dir="ltr">${qIndexGlobal(S.vi,S.qi)} / ${totalQ()}</span></button></div>
      <div class="row" style="margin-top:11px">${ICON.curtain}<span class="small">מאחורי הפרגוד — נשמר אצלך עד שתמסור</span>
        <span class="grow"></span>${tallyEl(redlineCount())}<span class="small" style="color:var(--line)">${redlineCount()||''}</span></div>
    </div>
    <div class="pad" style="padding-top:20px">
      <div class="label" style="margin-bottom:7px">שאלה ${q.n} מתוך ${v.questions.length}</div>
      <h2 style="text-wrap:pretty">${esc(q.title)}</h2>
      ${q.poles?`<div class="row" style="margin-top:11px;font-size:.72rem;color:var(--muted)">
        <span>${esc(poles[0].trim())}</span><span class="grow" style="height:1px;background:var(--rule)"></span><span>${esc((poles[1]||'').trim())}</span></div>`:''}
    </div>
    <div class="ladder">${q.rungs.map(r=>`<button class="rung ${a.level===r.level?'sel':''}" data-l="${r.level}">
      <span class="lvl">${r.level}</span><span class="txt">${esc(r.text)}</span><span class="tick">${ICON.check}</span></button>`).join('')}</div>
    <div class="stampbox">
      <button class="stampbtn ${a.principled?'on':''}" id="stamp" ${a.level?'':'disabled'}>
        <span class="stamp"><span class="mark">${ICON.check}</span><span>קו אדום</span></span>
      </button>
      <p class="small" style="margin:9px 2px 0">${a.principled
        ? 'חתום. רשימה שרחוקה מכאן בשני שלבים או יותר תסומן כחוצה אותו, והשאלה נספרת במשקל כפול. נגיעה נוספת מסירה את החותמת.'
        : 'אם זה תנאי שאין עליו ויכוח — חתום. השאלה תיספר במשקל כפול, ורשימה שרחוקה ממנה בשני שלבים תסומן כחוצה אותו.'}</p>
    </div>
    <div class="grow"></div>
    <div class="navbar">
      ${fromReview
        ? '<button class="btn primary" id="done" style="flex:1">לשמור ולחזור לסקירה</button>'
        : `<button class="iconbtn" id="prev">${ICON.back}</button>
           <button class="btn bare" id="skip" style="flex:0 0 74px">לדלג</button>
           <button class="btn primary" id="next" style="flex:1">הבא${ICON.next}</button>`}
    </div>
  </main>`);
  el.querySelector('.letterhead').append(spineEl(S.vi));
  el.querySelector('#jump').onclick=()=>{ S.openValue=v.id; S.returnTo='q'; S.screen='review'; render(); };
  el.querySelectorAll('.rung').forEach(b=>b.onclick=()=>{
    S.answers[q.id]={level:+b.dataset.l, principled:!!(S.answers[q.id]&&S.answers[q.id].principled)};
    commit(); render();
  });
  el.querySelector('#stamp').onclick=()=>{
    const cur=S.answers[q.id]; if(!cur||!cur.level) return;
    S.answers[q.id]={level:cur.level, principled:!cur.principled}; commit(); render();
  };
  if(fromReview){
    el.querySelector('#done').onclick=()=>{ S.returnTo=null; S.openValue=v.id; S.screen='review'; render(); };
  } else {
    el.querySelector('#next').onclick=()=>step(1);
    el.querySelector('#prev').onclick=()=>step(-1);
    el.querySelector('#skip').onclick=()=>{ delete S.answers[q.id]; commit(); step(1); };
  }
  return el;
}
function step(dir){
  const v=S.q.values[S.vi];
  if(dir>0){
    if(S.qi<v.questions.length-1) S.qi++;
    else if(S.vi<S.q.values.length-1){ S.vi++; S.qi=0; S.screen='value'; }
    else S.screen='review';
  } else {
    if(S.qi>0) S.qi--;
    else if(S.vi>0){ S.vi--; S.qi=S.q.values[S.vi].questions.length-1; }
    else S.screen='intro';
  }
  render();
}

/* ---------- 4 · review ---------- */
function reviewView(){
  const skipped = totalQ()-answered();
  const el=$(`<main>
    <div class="letterhead">
      <div class="row"><button class="row" style="gap:10px" id="bk">${ICON.back}<span class="mono" style="font-size:.95rem">סקירת הטופס</span></button>
        <span class="grow"></span><span class="mono" style="font-size:.82rem;color:var(--ink-soft)" dir="ltr">${answered()} / ${totalQ()}</span></div>
      <p class="small" style="margin:10px 0 0">כל תשובה פתוחה לשינוי עד המסירה, וגם אחריה — נגיעה בשאלה מחזירה אותך אליה ומחזירה אותך לכאן.</p>
    </div>
    <div class="pad" style="padding-top:14px"><div class="stack" style="gap:6px" id="chapters"></div></div>
    <div class="grow"></div>
    <div class="navbar" style="flex-direction:column;align-items:stretch;gap:11px">
      <div class="itm">${skipped?`<span style="color:var(--gold)">${ICON.warn}</span><span class="small" style="color:var(--ink-soft)">דילגת על ${qn(skipped)}. ${skipped===1?'היא לא נספרת':'הן לא נספרות'} באף התאמה.</span>`
        :`<span style="color:var(--assent)">${ICON.check}</span><span class="small" style="color:var(--ink-soft)">ענית על כל ${totalQ()} השאלות.</span>`}</div>
      <button class="btn primary" id="done">${S.submitted?'חזרה למגש':'להמשיך למסירה'}${ICON.next}</button>
    </div>
  </main>`);
  const back=()=>{ S.returnTo=null; S.screen = S.submitted ? 'results' : 'submit'; render(); };
  el.querySelector('#bk').onclick=back;
  el.querySelector('#done').onclick=back;
  const wrap=el.querySelector('#chapters');
  S.q.values.forEach((v,vi)=>{
    const open = S.openValue===v.id;
    const ans = v.questions.filter(q=>S.answers[q.id]&&S.answers[q.id].level).length;
    const red = v.questions.filter(q=>S.answers[q.id]&&S.answers[q.id].principled).length;
    const ch=$(`<div class="chapter ${open?'open':''}">
      <button class="head"><span class="n">${v.n}</span><span class="cn">${esc(v.name)}</span><span class="grow"></span>
        ${tallyEl(red)}<span class="small">${ans}/${v.questions.length}</span>
        <span style="color:${open?'var(--ink)':'#8E897B'}">${open?ICON.fold:ICON.down}</span></button></div>`);
    ch.querySelector('.head').onclick=()=>{ S.openValue = open ? null : v.id; render(); };
    if(open){
      const grid=$('<div class="qgrid"></div>');
      v.questions.forEach((q,qi)=>{
        const a=S.answers[q.id];
        const cls = !a||!a.level ? 'skip' : (a.principled?'red':'');
        const b=$(`<button class="qcell ${cls}" title="${esc(q.title)}">${a&&a.level?a.level:'—'}</button>`);
        b.onclick=()=>{ S.vi=vi; S.qi=qi; S.returnTo='review'; S.screen='q'; render(); };
        grid.append(b);
      });
      ch.append(grid);
      ch.append($(`<div class="row" style="padding:0 14px 12px;gap:14px;font-size:.62rem;color:var(--muted)">
        <span class="row" style="gap:5px"><i style="width:14px;height:3px;background:var(--line);display:block"></i>קו אדום</span>
        <span class="row" style="gap:5px"><i style="width:11px;height:11px;border:1px dashed var(--tray-edge);display:block"></i>דילגת</span></div>`));
      v.questions.forEach((q,qi)=>{
        const a=S.answers[q.id];
        const lvl=a&&a.level;
        const rung=lvl?q.rungs.find(r=>r.level===lvl):null;
        const row=$(`<button class="qrow">
          <span class="badge ${lvl?(a.principled?'red':''):'skip'}">${lvl||'—'}</span>
          <span class="stack grow" style="min-width:0">
            <span class="small" style="color:var(--muted)">שאלה ${q.n}</span>
            <span class="mono" style="font-size:.88rem;line-height:1.25;margin-top:2px">${esc(q.title)}</span>
            <span style="font-size:.76rem;line-height:1.45;margin-top:4px;color:${lvl?'var(--ink-soft)':'var(--line)'}">${lvl?esc(rung.text):'דילגת — השאלה לא נספרת באף התאמה'}</span>
          </span>
          <span class="act">${lvl?'לשנות':'לענות'}</span></button>`);
        row.onclick=()=>{ S.vi=vi; S.qi=qi; S.returnTo='review'; S.screen='q'; render(); };
        ch.append(row);
      });
    }
    wrap.append(ch);
  });
  return el;
}

      err.textContent = MAIL.test(u.email.trim())
        ? 'שם פרטי ושם משפחה נדרשים, באותיות עבריות בלבד.'
        : (HEB.test(u.first.trim())&&HEB.test(u.last.trim()) ? 'צריך כתובת מייל תקינה — היא המפתח שלך לחזור להמלצה.' : 'צריך שם פרטי, שם משפחה וכתובת מייל תקינה.');
      return;
    }
    err.textContent='';
    const btn=el.querySelector('#send'), note=el.querySelector('#note');
    if(!CONFIG.endpoint){ S.submitted=true; store.set('submitted',true); S.screen='results'; render(); return; }
    btn.disabled=true; note.textContent='מוסר… הניתוח לוקח כ־20 שניות';
    try{
      const r=await submitAnswers();
      S.submitted=true; store.set('submitted',true);
      S.analysis=r.analysis||null; store.set('analysis',S.analysis);
      if(r.token){ S.token=r.token; store.set('token',r.token); }
      S.screen='results'; render();
    }catch(e){
      btn.disabled=false;
      note.innerHTML='';
      err.textContent='המסירה נכשלה: '+e.message;
      if(!el.querySelector('#anyway')){
        const b=$('<button class="btn ghost" id="anyway" style="margin-top:10px">לפתוח את המגש בכל זאת — בלי לשמור ובלי ניתוח</button>');
        b.onclick=()=>{ S.submitted=true; store.set('submitted',true); S.screen='results'; render(); };
        el.querySelector('#note').after(b);
      }
    }
  };
  return el;
}
function readIdentity(el){
  return { first: el.querySelector('#first').value.trim(),
           last:  el.querySelector('#last').value.trim(),
           email: el.querySelector('#email').value.trim() };
}
async function submitAnswers(){
  const qs=allQ();
  const rows=ranked();
  const cands=rows.slice(0,CONFIG.topN);
  const packet={
    profile:{ answered:answered(), total:qs.length,
      redlines_by_value:Object.fromEntries(S.q.values.map(v=>[v.name, v.questions.filter(q=>S.answers[q.id]&&S.answers[q.id].principled).length])) },
    parties:cands.map(({p,s})=>({ name:p.name, letters:p.letters||'', leader:p.leader, match_pct:s.pct, components:p.components,
      user_redlines_crossed:s.redlines.map(r=>({value:r.q.value.name,question:r.q.title,user:r.a.level+' — '+(r.q.rungs.find(x=>x.level===r.a.level)||{}).text,party:r.t.level+' — '+(r.q.rungs.find(x=>x.level===r.t.level)||{}).text,party_note:r.t.note})),
      party_principles_user_far_from:s.theirs.map(r=>({value:r.q.value.name,question:r.q.title,user:r.a.level,party:r.t.level+' — '+(r.q.rungs.find(x=>x.level===r.t.level)||{}).text,party_note:r.t.note})),
      agreements:qs.filter(q=>S.answers[q.id]&&S.answers[q.id].level&&p.tags[q.id]&&p.tags[q.id].level&&Math.abs(S.answers[q.id].level-p.tags[q.id].level)<=1&&(S.answers[q.id].principled||p.tags[q.id].principled))
        .map(q=>({value:q.value.name,question:q.title,user:S.answers[q.id].level,party:p.tags[q.id].level,user_redline:!!S.answers[q.id].principled,party_principle:!!p.tags[q.id].principled,party_note:p.tags[q.id].note})),
      by_value:Object.fromEntries(S.q.values.map(v=>[v.name, s.byValue[v.id]?s.byValue[v.id].pct:null])) })),
  };
  const scores=Object.fromEntries(rows.map(r=>[r.p.id, r.s.pct]));
  const res=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'submit',name:fullName(),email:S.user.email,token:S.token||'',answers:S.answers,qids:qs.map(q=>q.id),scores,packet})});
  const j=await res.json(); if(j.error) throw new Error(j.error); return j;
}

function sectionTitle(text, color, sub){

function diffBlock(r, first){
  const cells=[5,4,3,2,1].map(l=>{
    const me=r.a.level===l, them=r.t.level===l;
    return `<div class="${me?'me':''}${them?' them':''}">${l}${me?'<small>אתה</small>':(them?'<small>הם</small>':'')}</div>`;
  }).join('');
  const meTxt=(r.q.rungs.find(x=>x.level===r.a.level)||{}).text||'';
  const themTxt=(r.q.rungs.find(x=>x.level===r.t.level)||{}).text||'';
  return $(`<div style="border-top:${first?'1.5px solid var(--ink)':'1px solid var(--rule)'};padding-top:13px;margin-top:${first?0:16}px">
    <div class="small">${esc(r.q.value.name)}</div>
    <div class="mono" style="font-size:.9rem;line-height:1.25;margin-top:2px">${esc(r.q.title)}</div>
    <div class="diffstrip">${cells}</div>
    <p style="margin:10px 0 0;font-size:.76rem;line-height:1.55;color:var(--ink-soft)">אתה: ${esc(meTxt)} הם: ${esc(themTxt)}${r.t.note?' '+esc(r.t.note):''}
      ${r.t.link?` <a href="${esc(r.t.link)}" target="_blank" rel="noopener">מקור</a>`:''}
      ${r.t.source==='estimate'?' <span style="color:var(--gold)">הערכה שטרם אושרה</span>':''}</p></div>`);
}
function gapSentence(s){
  const best=S.q.values.map(v=>({v,b:s.byValue[v.id]})).filter(x=>x.b).sort((a,b)=>b.b.pct-a.b.pct)[0];
  if(!best||!s.gapValue) return 'אין מספיק תשובות משותפות כדי לסכם את הפער.';
  if(best.v.id===s.gapValue.id) return `ההתאמה אחידה לאורך כל שבעת הערכים — ${best.b.pct}% בממוצע, בלי ערך אחד שבולט לטובה או לרעה.`;
  return `הכי קרובים ב<b>${esc(best.v.name)}</b> (${best.b.pct}%), והפער כולו ב<b>${esc(s.gapValue.name)}</b> (${s.byValue[s.gapValue.id].pct}%) — שם אתה בקצה אחד והם בקצה השני.`;
}

    <div class="grow"></div>
    <div class="stack" style="gap:10px;margin:26px 0">
      <button class="btn primary" id="send">לשלוח לי קישור${ICON.next}</button>
      <button class="btn ghost" id="new">לא מסרתי עדיין — להתחיל טופס</button>
    </div>
  </div>`);
  body.querySelector('#new').onclick=()=>{ S.screen='intro'; S.msg=''; render(); };
  body.querySelector('#send').onclick=async()=>{
    const email=body.querySelector('#rmail').value.trim();
    const err=body.querySelector('#rerr');
    if(!MAIL.test(email)){ err.textContent='צריך כתובת מייל תקינה.'; return; }
    if(!CONFIG.endpoint){ err.textContent='במצב מקומי אין שרת לשלוח ממנו.'; return; }
    const btn=body.querySelector('#send'); btn.disabled=true; err.textContent='שולח…';
    try{
      const res=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'recall_link', email})});
      const j=await res.json(); if(j.error) throw new Error(j.error);
      err.style.color='var(--assent)';
      err.textContent='אם יש טופס שנמסר מהכתובת הזאת — הקישור בדרך אליה.';
    }catch(e){ err.textContent='השליחה נכשלה: '+e.message; btn.disabled=false; }
  };
  el.append(body);
  return el;
}
async function recallByToken(token){
  try{
    const res=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'recall', token})});
    const j=await res.json(); if(j.error||!j.answers) return;
    S.answers=j.answers; commit();
    S.user={first:(j.name||'').split(' ')[0]||'', last:(j.name||'').split(' ').slice(1).join(' '), email:j.email||''};
    store.set('user',S.user);
    S.token=token; store.set('token',token);
    S.analysis=j.analysis||null; store.set('analysis',S.analysis);
    S.submitted=true; store.set('submitted',true);
    S.screen='results'; render();
  }catch(e){ console.warn('recall failed', e); }
}

/* ---------- admin ---------- */
function renderAdmin(app){
  const parties=S.p.parties;
  if(!S.adminParty) S.adminParty=parties[0].id;
  const party=parties.find(p=>p.id===S.adminParty);
  const qs=allQ();
  const stat=qs.reduce((o,q)=>{ const t=party.tags[q.id];
    if(!t||!t.level) o.missing++; else if(t.source==='estimate') o.est++; else o.ok++; return o; }, {ok:0,est:0,missing:0});

  const bar=$(`<div class="admin-bar">
    <div class="row"><span class="label" style="opacity:.6">תיוג</span><span class="grow"></span>
      <button id="export">ייצוא</button><span style="width:1px;height:13px;background:#ffffff33"></span>
      <button id="toapp">לשאלון</button></div>
    <div class="row" style="gap:12px;margin-top:12px">
      <span style="width:42px;height:54px;flex:0 0 42px;background:var(--slip);color:var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
        <span class="mono" style="font-size:1.05rem;line-height:1">${esc(party.letters||'—')}</span>
        <span style="width:14px;height:1px;background:var(--rule);display:block"></span></span>
      <span class="stack grow" style="min-width:0">
        <select id="party">${parties.map(p=>`<option value="${p.id}" ${p.id===party.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        <span class="small" style="color:#ffffffb3;margin-top:4px">${stat.ok} אושרו · ${stat.est} הערכות · ${stat.missing} חסרים</span>
      </span>
    </div>
    <div class="row" style="height:5px;margin-top:12px;gap:2px">
      <i style="height:5px;background:var(--paper);width:${100*stat.ok/qs.length}%"></i>
      <i style="height:5px;background:var(--gold);width:${100*stat.est/qs.length}%"></i>
    </div>
  </div>`);
  bar.querySelector('#party').onchange=e=>{ S.adminParty=e.target.value; S.vi=0; S.qi=0; render(); };
  bar.querySelector('#toapp').onclick=()=>{ location.hash=''; };
  bar.querySelector('#export').onclick=()=>{
    const blob=new Blob([JSON.stringify(S.p,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='parties.json'; a.click();
  };
  app.append(bar);

  const v=S.q.values[S.vi], q=v.questions[S.qi];
  const t=party.tags[q.id]||{level:null, principled:false, note:'', link:'', source:''};
  const main=$(`<main>
    <div class="pad" style="padding-top:16px">
      <div class="row" style="margin-bottom:11px"><span class="label">${qs.length} השאלות</span><span class="grow"></span>
        <span class="small row" style="gap:5px"><i style="width:9px;height:9px;background:var(--ink);display:block"></i>אושר</span>
        <span class="small row" style="gap:5px"><i style="width:9px;height:9px;background:var(--gold);display:block"></i>הערכה</span></div>
      <div class="heat" id="heat"></div>
    </div>
    <div class="pad" style="margin-top:18px;border-top:1.5px solid var(--ink);padding-top:14px">
      <div class="row"><span class="small">${esc(v.name)} · שאלה ${q.n} מתוך ${v.questions.length}</span><span class="grow"></span>
        ${t.source==='estimate'?'<span class="small row" style="gap:5px;color:var(--gold)"><i style="width:8px;height:8px;background:var(--gold);display:block"></i>הערכה של קלוד</span>':''}</div>
      <h2 style="margin-top:5px">${esc(q.title)}</h2>
      ${q.poles?`<div class="small" style="margin-top:5px">${esc(q.poles)}</div>`:''}
    </div>
    <div class="ladder">${q.rungs.map(r=>`<button class="rung ${t.level===r.level?(t.source==='estimate'?'est':'sel'):''}" data-l="${r.level}">
      <span class="lvl">${r.level}</span><span class="txt">${esc(r.text)}</span></button>`).join('')}</div>
    <div class="pad" style="margin-top:14px">
      <div class="row" style="gap:10px"><span class="small">אצלם זה</span>
        <span class="seg"><button class="${t.principled?'on':''}" data-w="1">עקרוני</button><button class="${!t.principled?'on neutral':''}" data-w="0">סחיר</button></span></div>
      <div class="field"><label>הנמקה — הצבעה, הצעת חוק, או ״פרשנות״</label><textarea id="note">${esc(t.note)}</textarea></div>
      <div class="field"><label>קישור למקור</label><input id="link" type="url" value="${esc(t.link)}" dir="ltr"></div>
    </div>
    <div class="grow"></div>
    <div class="navbar" style="flex-direction:column;align-items:stretch;gap:8px">
      ${t.source==='estimate'&&t.level?`<button class="btn primary" id="confirm">${ICON.check}ההערכה נכונה — לאשר ולהמשיך</button>`:''}
      <div class="row" style="gap:8px">
        <button class="iconbtn" id="prev">${ICON.back}</button>
        <button class="btn ghost grow" id="clear">אין נתון</button>
        <button class="btn ghost grow" id="next">${t.source==='estimate'&&t.level?'דלג':'שמירה והבא'}</button>
        <button class="iconbtn" id="fwd">${ICON.next}</button>
      </div>
    </div>
  </main>`);

  const heat=main.querySelector('#heat');
  S.q.values.forEach((vv,vidx)=>{
    const row=$(`<div class="hrow"><span>${esc(vv.name)}</span><span class="cells"></span></div>`);
    const cells=row.querySelector('.cells');
    vv.questions.forEach((qq,qidx)=>{
      const tt=party.tags[qq.id];
      const cls = !tt||!tt.level ? '' : (tt.source==='estimate'?'est':'ok');
      const cur = vidx===S.vi && qidx===S.qi ? ' cur' : '';
      const i=$(`<i class="${cls}${cur}" title="${esc(qq.title)}"></i>`);
      i.onclick=()=>{ grab(); S.vi=vidx; S.qi=qidx; render(); };
      cells.append(i);
    });
    heat.append(row);
  });

  const save=(partial)=>{
    party.tags[q.id]=Object.assign({level:null,principled:false,note:'',link:''}, party.tags[q.id]||{}, partial, {source:'tagger'});
    store.set('parties', S.p);
    if(CONFIG.endpoint){ const tt=party.tags[q.id];
      fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'tag',party_id:party.id,q_id:q.id,level:tt.level,principled:tt.principled,note:tt.note,link:tt.link})}).catch(()=>{});
    }
  };
  const grab=()=>{ const n=main.querySelector('#note'), l=main.querySelector('#link');
    if(n&&l&&(n.value!==(t.note||'')||l.value!==(t.link||''))) save({note:n.value, link:l.value}); };

  main.querySelectorAll('.rung').forEach(b=>b.onclick=()=>{ save({level:+b.dataset.l}); render(); });
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ save({principled:b.dataset.w==='1'}); render(); });
  const cf=main.querySelector('#confirm');
  if(cf) cf.onclick=()=>{ grab(); save({}); adminStep(1); };
  main.querySelector('#next').onclick=()=>{ grab(); adminStep(1); };
  main.querySelector('#fwd').onclick=()=>{ grab(); adminStep(1); };
  main.querySelector('#prev').onclick=()=>{ grab(); adminStep(-1); };
  main.querySelector('#clear').onclick=()=>{ delete party.tags[q.id]; store.set('parties',S.p); adminStep(1); };
  app.append(main);
}
function adminStep(dir){
  const v=S.q.values[S.vi];
  if(dir>0){ if(S.qi<v.questions.length-1) S.qi++; else if(S.vi<S.q.values.length-1){ S.vi++; S.qi=0; } }
  else { if(S.qi>0) S.qi--; else if(S.vi>0){ S.vi--; S.qi=S.q.values[S.vi].questions.length-1; } }
  render();
}

load();
</script>
</body>
</html>
